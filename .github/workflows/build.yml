name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --configuration Release
      # The test projects are not part of the solution, so they are run individually.
      - run: dotnet test tests/AutoOpcUaServer.Tests --configuration Release
      - run: dotnet test tests/AutoOpcUaServer.Gui.Tests --configuration Release
